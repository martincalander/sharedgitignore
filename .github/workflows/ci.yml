name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu / Node 24
            os: ubuntu-latest
            node: 24.x
          - name: Ubuntu / Node 26
            os: ubuntu-latest
            node: 26.x
          - name: macOS / Node 24
            os: macos-latest
            node: 24.x

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Ensure zsh is available
        shell: bash
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes zsh
          fi

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Run tests
        run: npm test

      - name: Check generated zsh completion syntax
        run: npm run check:zsh

      - name: Verify package contents
        run: npm run check:pack

      - name: Verify commands leave the checkout clean
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
